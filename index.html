<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/image/logo/media.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>山西农业大学青年融媒体中心</title>

    <!-- DNS 预解析，提前建立后端连接 -->
    <link rel="preconnect" href="https://api.blackbearcode.dpdns.org" crossorigin />

    <!-- 骨架屏样式（内联，不依赖外部资源） -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        #app:empty::before {
            content: '';
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            animation: fadeBg 8s ease-in-out infinite;
        }
        #app:empty::after {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            width: 48px;
            height: 48px;
            margin: -24px 0 0 -24px;
            border: 4px solid rgba(255,255,255,0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        #app:empty {
            position: relative;
        }
        /* 隐藏 loading：Vue 挂载后 #app 不再 empty */
        #app:not(:empty)::before,
        #app:not(:empty)::after {
            display: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes fadeBg {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
    </style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
