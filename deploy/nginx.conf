# 青年融媒体中心前端 · Nginx 部署示例
#
# 前端使用 HTML5 History 路由（createWebHistory），
# 服务器必须把未命中的路径回退到 index.html，
# 否则用户刷新 /tasks/1、/admin/members 这类地址会得到 404。
#
# 用法：替换 server_name 与 root 后放到 /etc/nginx/conf.d/ 并 reload。

server {
    listen       80;
    server_name  media.example.com;

    # 指向 `npm run build:server` 生成的 dist-server 目录（使用相对 /api 口径构建时）
    root   /var/www/media-center-admin/dist-server;
    index  index.html;

    # 静态资源：文件名带 hash，可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 后端接口反向代理
    # 注意：proxy_pass 不能带结尾斜杠。/api/ 会被替换成 /，导致 /api 前缀被剥掉，
    # 后端 SecurityConfig 按 /api 前缀放行/鉴权，前缀丢失会返回 401。
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退：其余请求都交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发版后能拿到最新入口
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
